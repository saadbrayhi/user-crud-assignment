<p-button
  label="Create user"
  icon="pi pi-plus"
  (onClick)="openCreateDialog()"
/>

<input
pInputText
type="text"
placeholder="Search users"
[(ngModel)]="searchValue"
(ngModelChange)="onSearchChange()"
/>
<p-table
    [value]="users"
    [loading]="loading"
    [tableStyle]="{'min-width':'60rem'}"
    [lazy]="true"
    [paginator]="true"
    [rows]="5"
    [totalRecords]="totalRecords"
    [rowsPerPageOptions]="[5,10,20]"
    (onLazyLoad)="loadUsers($event)"
>

    <ng-template #header>
        <tr>
            <th>Id</th>
            
            <th pSortableColumn="firstName">
                First name 
                <p-sortIcon field="firstName"/>
            </th>
            <th>last name</th>
            <th>email</th>
            <th>Created at</th>
            <th>Actions</th>
        </tr>
    </ng-template>

        <ng-template #body let-user>
            <tr>
                <td>{{user.id}}</td>
                <td>{{user.firstName}}</td>
                <td>{{user.lastName}}</td>
                <td>{{user.email}}</td>
                <td>{{user.createdAt}}</td>
                
                <td>
                <p-button
                    label="Edit"
                    icon="pi pi-pencil"
                    severity="secondary"
                    (onClick)="openEditDialog(user)"
                    />

                    
                <p-button
                    label="Delete"
                    icon="pi pi-trash"
                    severity="danger"
                    (onClick)="confirmDelete(user)"
                />
                </td>

            </tr>
        </ng-template>

</p-table>

<p-dialog
  [header]="selectedUser ? 'Edit user' : 'Create user'"
  [(visible)]="userDialogVisible"
  [modal]="true"
  [closable]="!saving"
  [style]="{ width: '30rem' }"
>
  <form
    [formGroup]="userForm"
    (ngSubmit)="submitUser()"
    class="user-form"
  >
    <label for="firstName">First name</label>
    <input
      id="firstName"
      pInputText
      formControlName="firstName"
    />

    <label for="lastName">Last name</label>
    <input
      id="lastName"
      pInputText
      formControlName="lastName"
    />

    <label for="email">Email</label>
    <input
      id="email"
      pInputText
      type="email"
      formControlName="email"
    />

    <div></div>

    <div class="dialog-actions">
      <p-button
        type="submit"
        label="Save"
        [loading]="saving"
        [disabled]="userForm.invalid"
      />

      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [disabled]="saving"
        (onClick)="closeUserDialog()"
      />
    </div>
  </form>
</p-dialog>
<p-confirmDialog/>
